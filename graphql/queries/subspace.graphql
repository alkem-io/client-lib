query subspace($spaceID: UUID_NAMEID!, $subspaceID: UUID_NAMEID!) {
  space(ID: $spaceID) {
    subspace(ID: $subspaceID) {
      nameID
      id
      profile {
        displayName
      }
      community {
        id
        roleSet {
          id
        }
      }
      collaboration {
        id
        calloutsSet {
          id
          callouts {
            nameID
            type
          }
        }
      }
      context {
        id
      }
    }
  }
}
