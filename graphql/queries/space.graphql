query space($id: UUID!) {
  lookup {
    space(ID: $id) {
      id
      nameID
      account {
        id
      }
      community {
        id
        roleSet {
          id
        }
      }
      profile {
        id
        displayName
        visuals {
          name
          id
        }
        references {
          id
          name
          description
          uri
        }
      }
      context {
        id
      }
      collaboration {
        id
      }
    }
  }
}
