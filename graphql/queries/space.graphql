query space($id: UUID!) {
  lookup {
    space(ID: $id) {
      id
      nameID
      account {
        id
      }
      community {
        id
        roleSet {
          id
        }
      }
      about {
        id
        profile {
          id
          displayName
          visuals {
            name
            id
          }
          references {
            id
            name
            description
            uri
          }
        }
      }
      collaboration {
        id
      }
    }
  }
}
