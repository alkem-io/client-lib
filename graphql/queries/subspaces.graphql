query subspaces($spaceID: UUID!) {
  lookup {
    space(ID: $spaceID) {
      subspaces {
        id
        nameID
        about {
          id
          profile {
            displayName
            visuals {
              name
              id
            }
          }
        }
        community {
          id
        }
        collaboration {
          id
        }
      }
    }
  }
}
