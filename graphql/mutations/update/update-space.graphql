mutation updateSpace($spaceData: UpdateSpaceInput!) {
  updateSpace(spaceData: $spaceData) {
    nameID
    account {
      host {
        nameID
      }
    }
    community {
      id
    }
    about {
      id
      profile {
        tagline
        visuals {
          id
          name
        }
      }
    }
  }
}
